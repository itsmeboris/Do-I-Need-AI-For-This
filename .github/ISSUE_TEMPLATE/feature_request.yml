name: Feature request
description: Suggest an improvement to the framework or workflow.
title: "[Idea]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe a concrete automation or review scenario.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
      description: What should change, and what have you tried?
    validations:
      required: true
